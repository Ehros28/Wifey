<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You Wifey❤</title>
    <style>
        body {
            background-color: #ffe6e6;
            font-family: 'Arial', sans-serif;
            text-align: center;
            padding: 50px;
            color: #d63384;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.5rem;
            color: #555;
        }
        .heart {
            font-size: 5rem;

        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="heart">❤</div>
    <h1>Hi Wifey Aliyah!</h1>
    <p>Wag kang papastress kaya moyan, Mwauh.</p>
    <p>Andito lang ako palagi sa tabi mo, I love you! 🥰</p>
</body>
</html>
